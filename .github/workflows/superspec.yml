name: SuperSpec

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "templates/**"
      - "adapters/**"
      - "schemas/**"
      - "superspec_guard.ts"
      - "superspec_init.ts"
      - "package.json"
      - "package-lock.json"
      - ".codex/skills/superspec-*/**"
      - ".codex/agents/**"
      - ".codex/prompts/**"
      - "docs/proposals/superspec/**"
      - ".gitignore"
      - ".github/workflows/superspec.yml"
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "templates/**"
      - "adapters/**"
      - "schemas/**"
      - "superspec_guard.ts"
      - "superspec_init.ts"
      - "package.json"
      - "package-lock.json"
      - ".codex/skills/superspec-*/**"
      - ".codex/agents/**"
      - ".codex/prompts/**"
      - "docs/proposals/superspec/**"
      - ".gitignore"
      - ".github/workflows/superspec.yml"
  # Opt-in real OpenSpec CLI smoke (audit F-4 / decision D5): manual trigger + weekly drift watch.
  workflow_dispatch:
    inputs:
      openspec_version:
        description: "openspec npm version to smoke against (default: latest)"
        required: false
        default: "latest"
  schedule:
    - cron: "0 3 * * 1"

jobs:
  superspec:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # Drift detector against the real openspec CLI (tests are skipped unless the env var is set).
  real-openspec-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install real openspec CLI
        run: npm install -g "@fission-ai/openspec@${{ github.event.inputs.openspec_version || 'latest' }}"

      - name: Real CLI smoke
        run: SUPERSPEC_REAL_OPENSPEC_SMOKE=1 node --test tests/test_real_openspec_smoke.test.ts
